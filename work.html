intelligence:{title:'Marketing Intelligence & Data Analysis',intro:'Research, consumer surveys, dashboards and market analysis that turn raw information into clear, decision-ready business direction.',metric:'181 valid survey responses',metricNoteHtml:'<p class="case-metric-lead">The research identified clear consumer needs and product opportunities across Fresh Chicken, Ready-to-Cook and Ready-to-Eat categories.</p><ul class="case-metric-list"><li><strong>87.3%</strong>preferred products that reduce preparation time</li><li><strong>84.0%</strong>purchased and consumed chicken at least weekly</li><li><strong>71.8%</strong>considered quality an important purchase factor</li><li><strong>61.3%</strong>preferred curry-cut Fresh Chicken formats</li><li><strong>74.0%</strong>showed interest in Ready-to-Cook Chicken Curry</li><li><strong>69.1%</strong>showed high interest in Ready-to-Eat chicken meals</li></ul>',visuals:['assets/projects/intelligence-01.png','assets/projects/intelligence-02.png','assets/projects/intelligence-03.png'],problemHtml:'<p>Management needed reliable consumer evidence to understand chicken-buying behavior, preparation difficulties and product preferences across <strong>Fresh Chicken, Ready-to-Cook and Ready-to-Eat</strong> categories.</p>',didHtml:'<p>I analyzed <strong>181 valid consumer survey responses</strong>, cleaned and structured the data, identified the strongest behavioral and product-preference trends, and converted the findings into management-ready dashboards and practical product recommendations.</p>',resultHtml:'<p>The analysis provided clear direction for product, packaging and marketing decisions:</p><ul class="case-result-list"><li>Prioritize convenient <strong>500g Fresh Chicken and Ready-to-Cook packs</strong></li><li>Focus on curry-cut formats, especially <strong>curry cut without skin</strong></li><li>Prioritize RTC flavors such as <strong>Chicken Curry, Chicken Bhuna and Jhal Fry</strong></li><li>Explore <strong>250g Ready-to-Eat meal packs</strong></li><li>Emphasize <strong>quality, freshness, hygiene and convenience</strong> in communication</li><li>Use <strong>sampling, introductory offers and recipe demonstrations</strong> to encourage trial</li></ul><p style="margin-top:14px">The survey transformed disconnected consumer responses into practical product-development and marketing direction.</p>',tools:['Consumer Survey Analysis','Excel','Dashboard Design','Market Analysis','Product Insight','Management Reporting']},
digital:{filterTitle:'Digital Marketing & Campaigns',title:'Social Media Management & Digital Campaign Strategy',intro:'Multi-brand social media management, content planning, performance monitoring, paid-media coordination and campaign strategy across consumer-facing brand pages.',metric:'772.8K views',metricNoteHtml:'<p class="case-metric-lead">January–July 2026 performance for Five Star Bangladesh, supported by ongoing management and monitoring of CP Fresh Chicken and CP Brand Bangladesh.</p><ul class="case-metric-list"><li><strong>243.9K</strong>total viewers</li><li><strong>326.8K</strong>organic views</li><li><strong>446.1K</strong>paid views</li><li><strong>5.4K</strong>content interactions</li><li><strong>18.9K</strong>3-second video views</li><li><strong>4d 9h</strong>watch time</li></ul>',visuals:['assets/projects/digital-01.png','assets/projects/digital-02.png','assets/projects/digital-03.png'],tools:['Multi-Brand Social Media Management','Meta Insights','Content Planning','Campaign Strategy','Boosting Coordination','KPI Analysis','Executive Reporting'],blocks:[
{label:'SOCIAL MEDIA PERFORMANCE',title:'Performance Analysis',body:'<p>Monitored page performance, audience activity, organic and paid contribution, content engagement and format-level results using <strong>Meta Insights</strong>.</p><ul class="case-result-list"><li><strong>Link-based content:</strong> 412.9K views</li><li><strong>Photo posts:</strong> 228.7K views</li><li><strong>Reels:</strong> 61.3K views</li><li><strong>Multi-photo content:</strong> 43.1K views</li><li><strong>Stories:</strong> 21.5K views</li></ul><p style="margin-top:14px">This analysis identified which content formats contributed most strongly to overall digital visibility.</p>'},
{label:'CONTENT & BOOSTING PLAN',title:'Content Planning',body:'<p>Developed and coordinated monthly content plans covering product communication, promotional content, brand storytelling, franchise opportunities, events, community engagement and video/Reels.</p><p style="margin-top:14px">The planning process included content scheduling, platform selection, boosting priorities, content recovery actions and supplier coordination.</p><div class="brand-note"><strong>Key responsibilities:</strong> Content Calendar · Content Mix Planning · Supplier Coordination · Boosting Planning · Paid vs Organic Monitoring · Monthly Performance Review</div>'},
{label:'CAMPAIGN STRATEGY',title:'Campaign Strategy',body:'<p>Structured digital campaigns around the customer journey, supported by audience definition, platform strategy, content pillars, paid-media support, campaign phases, KPI targets and optimization actions.</p><div class="funnel-line"><span>Awareness</span><b>→</b><span>Engagement</span><b>→</b><span>Traffic</span><b>→</b><span>Conversion</span></div><p style="margin-top:14px">Key channels included <strong>Facebook, Instagram and Messenger</strong>, supported by targeted paid campaigns for reach, traffic, engagement and lead generation.</p>'},
{label:'WHAT I DID',title:'My Role',body:'<p>Managed and monitored multiple brand social media pages, coordinated content and campaign activities, reviewed supplier execution, analyzed Meta performance data, tracked organic and paid results, identified high-performing content and converted findings into management-ready dashboards and recommendations.</p>',showTools:true},
{label:'RESULT',title:'Result',wide:true,body:'<p>The work created a more structured and measurable approach to digital marketing across multiple brand pages.</p><ul class="case-result-list"><li>Five Star Bangladesh delivered <strong>772.8K views</strong> from <strong>243.9K viewers</strong> during January–July 2026.</li><li>The page generated <strong>5.4K content interactions</strong> while organic and paid performance were monitored separately.</li><li>Content-format analysis identified <strong>link-based content as the strongest visibility-driving format</strong> at 412.9K views.</li><li>The broader work strengthened hands-on experience in <strong>multi-brand digital management, campaign planning, supplier coordination, performance analysis and management reporting</strong>.</li></ul><div class="brand-note"><strong>Brands managed / monitored:</strong> Five Star Bangladesh · CP Fresh Chicken · CP Brand Bangladesh</div>'}
]},

s','Merchandise','Corporate Communication','Creative Adaptation']},

activation:{title:'Brand Activation & Event Management',intro:'Exhibitions, launches, activations and event communication that connect physical execution with brand visibility and customer engagement.',metric:'[ADD METRIC]',metricNote:'Add the verified number of events, activations, visitors or leads.',visuals:[null,null,null],problem:'Brand events and exhibitions needed coordinated communication, strong on-ground visibility and practical execution across multiple physical touchpoints.',did:'Supported event strategy, booth/activation communication, opening materials, POSM, exhibition planning and customer-facing execution across brand and product initiatives.',result:'Created clearer, more integrated event experiences. Add verified counts for events, visitors, leads or franchise conversions to quantify impact.',tools:['Event planning','Brand activation','POSM','Exhibition strategy','Launch communication']},

e systems with <strong>AI, predictive analytics and computer vision</strong> for smarter decision support.</p>',resultHtml:'<p>Converted key manual processes into more <strong>structured, traceable and data-driven workflows</strong>.</p><ul class="case-result-list"><li>Improved operational visibility across departments and simplified order-status monitoring.</li><li>Supported logistics planning using outlet and delivery information.</li><li>Created centralized outlet visit and QC records for management analysis.</li><li>Established a digital foundation for future AI-assisted decision support.</li></ul><div class="brand-note"><strong>Future AI opportunities:</strong> Demand forecasting · AI-assisted route optimization · Anomaly detection · Computer-vision QC · AI-based management reporting</div>',tools:['Business Process Analysis','Digital Transformation','Workflow Design','Requirements Gathering','Data Analysis','System Implementation','AI Integration Concepts','Computer Vision','Cross-functional Collaboration']},

document.getElementById('title').textContent=active.title+'.';document.getElementById('intro').textContent=active.intro;document.getElementById('metric').textContent=active.metric;const metricNote=document.getElementById('metricNote');if(active.metricNoteHtml){metricNote.innerHTML=active.metricNoteHtml}else{metricNote.textContent=active.metricNote||''}document.title=active.title+' | Jahid Hassan Rakib Portfolio';

requestAnimationFrame(()=>document.body.classList.add('page-ready'));
