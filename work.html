const cases={
intelligence:{title:'Marketing Intelligence & Data Analysis',intro:'Research, consumer surveys, dashboards and market analysis that turn raw information into clear, decision-ready business direction.',metric:'181 valid survey responses',metricNoteHtml:'<p class="case-metric-lead">The research identified clear consumer needs and product opportunities across Fresh Chicken, Ready-to-Cook and Ready-to-Eat categories.</p><ul class="case-metric-list"><li><strong>87.3%</strong>preferred products that reduce preparation time</li><li><strong>84.0%</strong>purchased and consumed chicken at least weekly</li><li><strong>71.8%</strong>considered quality an important purchase factor</li><li><strong>61.3%</strong>preferred curry-cut Fresh Chicken formats</li><li><strong>74.0%</strong>showed interest in Ready-to-Cook Chicken Curry</li><li><strong>69.1%</strong>showed high interest in Ready-to-Eat chicken meals</li></ul>',visuals:['assets/projects/intelligence-01.png','assets/projects/intelligence-02.png','assets/projects/intelligence-03.png'],problemHtml:'<p>Management needed reliable consumer evidence to understand chicken-buying behavior, preparation difficulties and product preferences across <strong>Fresh Chicken, Ready-to-Cook and Ready-to-Eat</strong> categories.</p>',didHtml:'<p>I analyzed <strong>181 valid consumer survey responses</strong>, cleaned and structured the data, identified the strongest behavioral and product-preference trends, and converted the findings into management-ready dashboards and practical product recommendations.</p>',resultHtml:'<p>The analysis provided clear direction for product, packaging and marketing decisions:</p><ul class="case-result-list"><li>Prioritize convenient <strong>500g Fresh Chicken and Ready-to-Cook packs</strong></li><li>Focus on curry-cut formats, especially <strong>curry cut without skin</strong></li><li>Prioritize RTC flavors such as <strong>Chicken Curry, Chicken Bhuna and Jhal Fry</strong></li><li>Explore <strong>250g Ready-to-Eat meal packs</strong></li><li>Emphasize <strong>quality, freshness, hygiene and convenience</strong> in communication</li><li>Use <strong>sampling, introductory offers and recipe demonstrations</strong> to encourage trial</li></ul><p style="margin-top:14px">The survey transformed disconnected consumer responses into practical product-development and marketing direction.</p>',tools:['Consumer Survey Analysis','Excel','Dashboard Design','Market Analysis','Product Insight','Management Reporting']},
digital:{filterTitle:'Digital Marketing & Campaigns',title:'Social Media Management & Digital Campaign Strategy',intro:'Multi-brand social media management, content planning, performance monitoring, paid-media coordination and campaign strategy across consumer-facing brand pages.',metric:'772.8K views',metricNoteHtml:'<p class="case-metric-lead">January–July 2026 performance for Five Star Bangladesh, supported by ongoing management and monitoring of CP Fresh Chicken and CP Brand Bangladesh.</p><ul class="case-metric-list"><li><strong>243.9K</strong>total viewers</li><li><strong>326.8K</strong>organic views</li><li><strong>446.1K</strong>paid views</li><li><strong>5.4K</strong>content interactions</li><li><strong>18.9K</strong>3-second video views</li><li><strong>4d 9h</strong>watch time</li></ul>',visuals:['assets/projects/digital-01.png','assets/projects/digital-02.png','assets/projects/digital-03.png'],tools:['Multi-Brand Social Media Management','Meta Insights','Content Planning','Campaign Strategy','Boosting Coordination','KPI Analysis','Executive Reporting'],blocks:[{label:'SOCIAL MEDIA PERFORMANCE',title:'Performance Analysis',body:'<p>Monitored page performance, audience activity, organic and paid contribution, content engagement and format-level results using <strong>Meta Insights</strong>.</p><ul class="case-result-list"><li><strong>Link-based content:</strong> 412.9K views</li><li><strong>Photo posts:</strong> 228.7K views</li><li><strong>Reels:</strong> 61.3K views</li><li><strong>Multi-photo content:</strong> 43.1K views</li><li><strong>Stories:</strong> 21.5K views</li></ul><p style="margin-top:14px">This analysis identified which content formats contributed most strongly to overall digital visibility.</p>'},{label:'CONTENT & BOOSTING PLAN',title:'Content Planning',body:'<p>Developed and coordinated monthly content plans covering product communication, promotional content, brand storytelling, franchise opportunities, events, community engagement and video/Reels.</p><p style="margin-top:14px">The planning process included content scheduling, platform selection, boosting priorities, content recovery actions and supplier coordination.</p><div class="brand-note"><strong>Key responsibilities:</strong> Content Calendar · Content Mix Planning · Supplier Coordination · Boosting Planning · Paid vs Organic Monitoring · Monthly Performance Review</div>'},{label:'CAMPAIGN STRATEGY',title:'Campaign Strategy',body:'<p>Structured digital campaigns around the customer journey, supported by audience definition, platform strategy, content pillars, paid-media support, campaign phases, KPI targets and optimization actions.</p><div class="funnel-line"><span>Awareness</span><b>→</b><span>Engagement</span><b>→</b><span>Traffic</span><b>→</b><span>Conversion</span></div><p style="margin-top:14px">Key channels included <strong>Facebook, Instagram and Messenger</strong>, supported by targeted paid campaigns for reach, traffic, engagement and lead generation.</p>'},{label:'WHAT I DID',title:'My Role',body:'<p>Managed and monitored multiple brand social media pages, coordinated content and campaign activities, reviewed supplier execution, analyzed Meta performance data, tracked organic and paid results, identified high-performing content and converted findings into management-ready dashboards and recommendations.</p>',showTools:true},{label:'RESULT',title:'Result',wide:true,body:'<p>The work created a more structured and measurable approach to digital marketing across multiple brand pages.</p><ul class="case-result-list"><li>Five Star Bangladesh delivered <strong>772.8K views</strong> from <strong>243.9K viewers</strong> during January–July 2026.</li><li>The page generated <strong>5.4K content interactions</strong> while organic and paid performance were monitored separately.</li><li>Content-format analysis identified <strong>link-based content as the strongest visibility-driving format</strong> at 412.9K views.</li><li>The broader work strengthened hands-on experience in <strong>multi-brand digital management, campaign planning, supplier coordination, performance analysis and management reporting</strong>.</li></ul><div class="brand-note"><strong>Brands managed / monitored:</strong> Five Star Bangladesh · CP Fresh Chicken · CP Brand Bangladesh</div>'}]},
design:{title:'Graphic Design & Brand Communication',intro:'High-volume creative production, campaign design and brand communication across digital, print, packaging, events and corporate touchpoints.',metric:'20,000+ design deliverables',metricNoteHtml:'<p class="case-metric-lead">High-volume creative production spanning original concepts, resizing, format adaptation, production updates and day-to-day business requirements.</p><ul class="case-metric-list"><li><strong>Social</strong>Campaign & content design</li><li><strong>Packaging</strong>Product & pack communication</li><li><strong>Print</strong>POSM, leaflets & banners</li><li><strong>Events</strong>X-banners & event materials</li><li><strong>Merch</strong>Apparel & merchandise assets</li><li><strong>Corporate</strong>Business communication</li></ul>',visuals:['assets/projects/design-01.png','assets/projects/design-02.png','assets/projects/design-03.png'],problemHtml:'<p>Ongoing marketing and business activities required a continuous flow of creative materials across <strong>multiple brands, products, campaigns and formats</strong>—while maintaining visual consistency and responding quickly to changing requirements.</p>',didHtml:'<p>Developed original campaign creatives and handled high-volume design execution across <strong>social media, packaging, banners, X-banners, leaflets, POSM, merchandise, events and corporate communication</strong>. Adapted master creatives into multiple formats for both digital and physical touchpoints.</p>',resultHtml:'<p>Delivered <strong>20,000+ design outputs</strong> across original creative work, adaptations and production updates, creating a consistent and flexible visual presence across customer-facing and business-facing communication.</p><div class="brand-note"><strong>Scope:</strong> Original creative work · Resizing · Format adaptation · Production updates · Day-to-day business requirements</div>',tools:['Social & Campaign Design','Packaging','Print & POSM','Event Materials','Merchandise','Corporate Communication','Creative Adaptation']},
packaging:{"topLabel":"SELECTED WORK · MINI CASE STUDY","title":"Packaging Design & NPD","intro":"Consumer-led packaging and new product development across ready-to-eat, frozen-food and processed-food categories—connecting consumer insight, R&D collaboration, product development, brand communication and production-ready packaging execution.","metric":"30+ NPD & Packaging Projects","metricNoteHtml":"<p class=\"case-metric-lead\">Collaborated with the R&D team across 30+ new product development and packaging projects, connecting consumer needs and product concepts with production-ready packaging.</p><ul class=\"case-metric-list\"><li><strong>R&D</strong>Consumer insight to product concepts</li><li><strong>NPD</strong>Food product & packaging development</li><li><strong>Design</strong>Brand-led, bilingual artwork</li><li><strong>Market</strong>Three featured ranges launched & selling</li></ul>","visuals":["assets/projects/packaging-01.png","assets/projects/packaging-02.png","assets/projects/packaging-03.png"],"visualAlts":["Italian Chili Bologna bilingual market-ready packaging design with product visualization and regulatory information layout","Chicken Samosa and Chicken Spring Roll frozen snack packaging range and variant system","Ready-to-eat Spicy Chicken Burger, Tandoori Burger and Spicy Maxx Burger packaging design family"],"visualDetails":[{"number":"01","label":"ITALIAN CHILI BOLOGNA","title":"Italian Chili Bologna — Market-Ready Packaging","subtitle":"Bilingual packaging system for snack positioning, product visualization and organized regulatory communication.","status":"LAUNCHED & AVAILABLE IN MARKET","highlights":["Bilingual product identity","Brand & product-name hierarchy","Food visualization","Nutrition & regulatory layout","Print-ready artwork","Market application"]},{"number":"02","label":"FROZEN FOOD PACKAGING RANGE","title":"Frozen Snacks — Packaging Range System","subtitle":"Chicken Samosa · Chicken Spring Roll","statement":"One Brand · Two Variants · One Consistent Packaging System","highlights":["Range consistency","Variant differentiation","Bilingual hierarchy","Product visualization","Pack-count communication","Retail readability","Storage & cooking information","Production-ready artwork"],"status":"LAUNCHED & AVAILABLE IN MARKET"},{"number":"03","label":"READY-TO-EAT BURGER PACKAGING","title":"Ready-to-Eat Burger — Packaging Design System","subtitle":"Spicy Chicken Burger · Tandoori Burger · Spicy Maxx Burger","statement":"Three Product Variants · One Recognisable Brand Family","highlights":["Packaging concept development","Front-of-pack hierarchy","Bilingual naming","Variant identity","Product photography integration","Nutrition & ingredient layout","Cooking & storage communication","Dieline-based artwork execution"],"status":"LAUNCHED & AVAILABLE IN MARKET"}],"tools":["Consumer Insight","Market Research","R&D Collaboration","New Product Development","Packaging Strategy","Packaging Concept","Brand Identity","Bilingual Communication","Front-of-Pack Hierarchy","Range Architecture","Variant Differentiation","Food Visualization","Artwork Layout","Dieline Execution","Regulatory Communication","Print-Ready Design"],"blocks":[{"label":"FEATURED PACKAGING WORK","title":"Packaging Systems","body":"<p>Three selected food-packaging projects, each <strong>launched, available in the market and currently selling</strong>.</p><ul class=\"case-result-list\"><li><strong>Italian Chili Bologna:</strong> bilingual hierarchy, food visualization and nutrition/regulatory layout.</li><li><strong>Frozen Snacks:</strong> Chicken Samosa and Chicken Spring Roll — one brand, two variants and one consistent packaging system.</li><li><strong>Ready-to-Eat Burgers:</strong> Spicy Chicken Burger, Tandoori Burger and Spicy Maxx Burger — three variants in one recognisable brand family.</li></ul>"},{"label":"THE CHALLENGE","title":"The Challenge","body":"<p>New food products needed packaging that attracts attention, communicates clearly, differentiates variants and stays consistent with the parent brand.</p><p style=\"margin-top:12px\">The challenge: translate <strong>consumer expectations and R&D concepts</strong> into credible, production-ready packaging.</p>"},{"label":"MY CONTRIBUTION","title":"From Insight to Packaging","body":"<p>I contributed across the development process, connecting product needs with visual and technical execution.</p><ul class=\"case-result-list\"><li><strong>Consumer & market:</strong> insights, buying considerations and communication opportunities.</li><li><strong>R&D & NPD:</strong> product concepts, characteristics and packaging direction across 30+ projects.</li><li><strong>Concept & design:</strong> bilingual front-of-pack hierarchy, range identity and variant differentiation.</li><li><strong>Visualization:</strong> food photography, texture, flavour and serving representation.</li><li><strong>Packaging systems:</strong> repeatable layouts, product naming and pack-count information.</li><li><strong>Production-ready:</strong> nutrition, ingredients, allergens, storage, preparation, dielines and print-ready artwork.</li></ul>"},{"label":"MY ROLE & CORE SKILLS","title":"My Role","body":"<p>Consumer Insight · R&D Collaboration · NPD Support · Packaging Concept · Range System · Artwork Layout · Product Visualization · Dieline & Print-Ready Execution.</p>","showTools":true},{"label":"OUTCOME","title":"From Consumer Insight to Market-Ready Packaging","wide":true,"body":"<p>Contributed to <strong>30+ NPD and packaging projects</strong> across ready-to-eat, frozen-food and processed-food categories. All three featured packaging projects are <strong>launched, available in the market and currently selling</strong>.</p><p style=\"margin-top:14px\">My work connects <strong>consumer research, R&D collaboration, product-development thinking, visual communication and technical artwork execution</strong> to create clear, consistent, distinctive and commercially practical packaging.</p><div class=\"brand-note\"><strong>Development flow:</strong> Consumer Insight → R&D Collaboration → NPD → Packaging Design → Market Application</div>"}]},
activation:{"title":"Brand Activation & Event Management","intro":"Exhibition branding, franchise-focused activations and food showcases for CP Bangladesh and CP Five Star, from management approval to print-ready artwork.","metric":"12 documented events","metricNoteHtml":"<p class=\"case-metric-lead\">Distinct events identified in CP Bangladesh correspondence, 2024–2026.</p><ul class=\"case-metric-list\"><li><strong>12</strong>distinct events identified</li><li><strong>3 years</strong>2024–2026 coverage</li><li><strong>4</strong>featured projects with email evidence</li><li><strong>3 days</strong>Top Thai Brands 2026</li><li><strong>3</strong>events in 2026</li><li><strong>37</strong>Top Thai 2026 booth number</li></ul>","visuals":["assets/projects/activation-01.jpg","assets/projects/activation-02.jpg","assets/projects/activation-03.jpg"],"visualAlts":["Brand Activation & Event Management — first uploaded event visual","Brand Activation & Event Management — second uploaded event visual","Brand Activation & Event Management — third uploaded event visual"],"tools":["Exhibition Branding","Event Planning","Print & POSM","Franchise Communication","Supplier Coordination","Team Communication","Brand Activation"],"blocks":[{"label":"THE CHALLENGE","title":"Connecting the brand to real-world audiences","body":"<p>Booths, food counters, signage, product displays and franchise conversations all had to look and feel like one brand. Several teams were involved, and print deadlines were fixed.</p>"},{"label":"MY CONTRIBUTION","title":"From brief to production","body":"<p>Management-approval requests, exhibition artwork, print-ready large-format files, franchise-sourcing banners and pre-event team coordination.</p>","showTools":true},{"label":"FEATURED CASE · 2026","title":"Josephite Intra Math Fiesta","body":"<p><strong>2–3 July 2026 · St. Joseph Higher Secondary School, Mohammadpur.</strong></p><p>Prepared and sent the print-production package for the event branding, and coordinated the file handoff and printing requirements.</p><div class=\"brand-note\"><strong>Evidence:</strong> design-file submission email, 29 June 2026.</div>"},{"label":"FEATURED CASE · 2026","title":"Top Thai Brands","body":"<p><strong>23–25 July 2026 · Pan Pacific Sonargaon, Dhaka · Booth 37.</strong></p><p>Sent the participation confirmation and coordinated the pre-event team meeting. The booth covered Fresh Chicken, Processed Food and Five Star, supported by fascia signage, PVC logos and two-sided product-display shelves.</p><div class=\"brand-note\"><strong>Evidence:</strong> team-coordination email, 18 July 2026.</div>"},{"label":"FEATURED CASE · 2025","title":"Food & Agro Bangladesh Expo","body":"<p><strong>8–10 May 2025 · ICCB, Dhaka.</strong></p><p>Requested management approval for CP and Five Star participation, covering brand representation, product-quality showcase and franchise-partner engagement. Related emails cover supplier proposals and stall design.</p><div class=\"brand-note\"><strong>Evidence:</strong> management-approval request, 17 April 2025.</div>"},{"label":"FEATURED CASE · 2025","title":"Thailand Week","body":"<p><strong>10–12 July 2025 · Pan Pacific Sonargaon, Dhaka.</strong></p><p>Submitted print-ready artwork for a 2 ft × 5 ft franchise-sourcing X-banner and the event backdrop. The CP Five Star showcase included a model outlet, RTE and MT product displays and franchise communication.</p><div class=\"brand-note\"><strong>Evidence:</strong> design submission email, 7 July 2025.</div>"},{"label":"EVENT RECORD · 2024–2026","title":"Additional exhibition experience","wide":true,"body":"<p>Distinct events identified in company correspondence:</p><ul class=\"case-result-list\"><li><strong>2024:</strong> Livestock Service Week &amp; Exhibition; 7th Food Bangladesh International Expo (9–11 May, ICCB); Top Thai Brands (10–13 July, Pan Pacific Sonargaon).</li><li><strong>2025:</strong> 13th International Poultry Show &amp; Seminar (20–22 February, Purbachal); 8th Food &amp; Agro Bangladesh International Expo (8–10 May, ICCB); Thailand Week (10–12 July, Pan Pacific Sonargaon); Southeast University event; Poultry &amp; Soya Food Fest (KIB, Farmgate); National Livestock Week (26–28 November, Agargaon).</li><li><strong>2026:</strong> 6th AHCAB International Expo (8–10 January, ICCB); Josephite Intra Math Fiesta (2–3 July); Top Thai Brands (23–25 July).</li></ul><div class=\"brand-note\"><strong>Note:</strong> Some entries document company participation rather than my individual deliverables. Visitor, sales and lead figures are not claimed without verified event reports.</div>"},{"label":"RESULT","title":"A consistent, production-ready brand presence","wide":true,"body":"<p>Turned event goals into real branded touchpoints: large-format backdrops, counter graphics, franchise-sourcing materials, product displays and clear team communication.</p>"}]},
tech:{title:'AI, Digital Systems & Technology',intro:'Business-focused digital systems, workflow automation and AI-enabled concepts designed to reduce manual work, improve operational visibility and support faster decision-making.',metric:'3 Digital Business Systems',metricNoteHtml:'<p class="case-metric-lead">Developed with the IT team across Digital Order Management, Logistics Route Planning and Outlet Visit & QC Tracking—connecting operational data from order placement to delivery and field execution.</p><ul class="case-metric-list"><li><strong>Order</strong>Digital Order Management</li><li><strong>Route</strong>Logistics & outlet coverage planning</li><li><strong>Field</strong>Outlet Visit & QC Tracking</li><li><strong>AI-ready</strong>Foundation for smarter decision support</li></ul>',visuals:['assets/projects/tech-01.png','assets/projects/tech-02.png','assets/projects/tech-03.png'],problemHtml:'<p>Several operational processes depended on <strong>Excel files, phone calls, WhatsApp communication and manual follow-up</strong>. This made order tracking, departmental coordination, logistics planning, field monitoring and management analysis more time-consuming.</p>',didHtml:'<p>Analyzed existing operational workflows and worked with the <strong>IT team and cross-functional departments</strong> to convert business requirements into structured digital systems.</p><ul class="case-result-list"><li><strong>Digital Order Management System:</strong> Connected Sales, Sales Admin, Planning, Production, Warehouse, Accounts and Logistics in one structured order workflow.</li><li><strong>Digital Logistics & Route Planning:</strong> Used outlet and delivery data to support route planning, outlet coverage and logistics coordination.</li><li><strong>Outlet Visit & QC Tracking:</strong> Digitized officer visits, GPS-linked outlet tracking, QC checklists, photos, sales information and visit reporting.</li></ul><p style="margin-top:14px">Also identified opportunities to extend these systems with <strong>AI, predictive analytics and computer vision</strong> for smarter decision support.</p>',resultHtml:'<p>Converted key manual processes into more <strong>structured, traceable and data-driven workflows</strong>.</p><ul class="case-result-list"><li>Improved operational visibility across departments and simplified order-status monitoring.</li><li>Supported logistics planning using outlet and delivery information.</li><li>Created centralized outlet visit and QC records for management analysis.</li><li>Established a digital foundation for future AI-assisted decision support.</li></ul><div class="brand-note"><strong>Future AI opportunities:</strong> Demand forecasting · AI-assisted route optimization · Anomaly detection · Computer-vision QC · AI-based management reporting</div>',tools:['Business Process Analysis','Digital Transformation','Workflow Design','Requirements Gathering','Data Analysis','System Implementation','AI Integration Concepts','Computer Vision','Cross-functional Collaboration']},
apparel:{topLabel:'SELECTED WORK · CREATIVE SHOWCASE',metricLabel:'DESIGN SCOPE',title:'Apparel & Freelance Design',intro:'Original apparel graphics, typography and merchandise concepts developed into polished, presentation-ready product visuals.',metric:'T-SHIRTS · HOODIES · MERCHANDISE',metricNoteHtml:'<p class="case-metric-lead">Original graphics, garment applications and realistic mockup presentations across multiple apparel formats.</p>',visuals:['assets/projects/apparel-01.png','assets/projects/apparel-02.png','assets/projects/apparel-03.png'],tools:['Graphic Design','Apparel Design','Typography','Mockup Design','Merchandise','Product Presentation'],blocks:[{label:'CREATIVE FOCUS',title:'Creative Focus',body:'<p>Developing apparel graphics that remain visually strong as standalone artwork while translating naturally across garments, merchandise and real-world product applications.</p>'},{label:'MY ROLE',title:'What I Created',body:'<p>Designed original graphics, typography-led artwork, front and back garment layouts, color variations and realistic product mockups for T-shirts, hoodies and merchandise.</p>',showTools:true},{label:'DELIVERABLES',title:'Final Output',body:'<p>Created cohesive apparel concepts from initial artwork through final product visualization, presented in polished and realistic formats suitable for client review, presentation and portfolio showcase.</p>'}]},

document.getElementById('caseLabel').textContent=active.topLabel||'SELECTED WORK · MINI CASE STUDY';document.getElementById('metricLabel').textContent=active.metricLabel||'MEASURABLE OUTCOME';document.getElementById('title').textContent=active.title+'.';document.getElementById('intro').textContent=active.intro;document.getElementById('metric').textContent=active.metric;const metricNote=document.getElementById('metricNote');if(active.metricNoteHtml){metricNote.innerHTML=active.metricNoteHtml}else{metricNote.textContent=active.metricNote||''}document.title=active.title+' | Jahid Hassan Rakib Portfolio';
const visuals=document.getElementById('visuals');const freshTech=Date.now();
if(activeKey==='packaging')visuals.classList.add('packaging-gallery');
if(activeKey==='activation')visuals.classList.add('activation-gallery');
active.visuals.forEach((src,i)=>{

  if(src){
    const img=document.createElement('img');
    img.src=activeKey==='tech'?src+'?v='+freshTech:src;

    d.appendChild(img);

  }else d.innerHTML=activeKey==='activation'?'':'<div class="case-empty">Visual '+String(i+1).padStart(2,'0')+' · add verified project image</div>';
  visuals.appendChild(d);
});

// Project image lightbox / gallery viewer
const lightbox=document.getElementById('workLightbox');
const lightboxImage=document.getElementById('lightboxImage');
const lightboxCounter=document.getElementById('lightboxCounter');
const lightboxClose=document.getElementById('lightboxClose');
const lightboxPrev=document.getElementById('lightboxPrev');
const lightboxNext=document.getElementById('lightboxNext');
const lightboxStage=document.getElementById('lightboxStage');
let galleryImages=[];
let galleryIndex=0;
let touchStartX=0;

function syncGalleryImages(){
  galleryImages=[...visuals.querySelectorAll('.case-visual img')];
  lightbox?.classList.toggle('lightbox-single',galleryImages.length<=1);
}
function showGalleryImage(index){
  if(!galleryImages.length)return;
  galleryIndex=(index+galleryImages.length)%galleryImages.length;
  const source=galleryImages[galleryIndex];
  lightboxImage.src=source.currentSrc||source.src;
  lightboxImage.alt=source.alt||active.title+' project visual';
  lightboxCounter.textContent=(galleryIndex+1)+' / '+galleryImages.length;
}
function openLightbox(index){
  syncGalleryImages();
  if(!galleryImages.length)return;
  showGalleryImage(index);
  lightbox.classList.add('open');
  lightbox.setAttribute('aria-hidden','false');
  document.body.classList.add('lightbox-lock');
  lightboxClose.focus();
}
function closeLightbox(){
  lightbox.classList.remove('open');
  lightbox.setAttribute('aria-hidden','true');
  document.body.classList.remove('lightbox-lock');
}
function moveLightbox(step){showGalleryImage(galleryIndex+step)}

syncGalleryImages();
visuals.addEventListener('click',e=>{
  const img=e.target.closest('.case-visual img');
  if(!img)return;
  syncGalleryImages();
  const index=galleryImages.indexOf(img);
  if(index>-1)openLightbox(index);
});
lightboxClose.addEventListener('click',closeLightbox);
lightboxPrev.addEventListener('click',()=>moveLightbox(-1));
lightboxNext.addEventListener('click',()=>moveLightbox(1));
lightbox.addEventListener('click',e=>{if(e.target===lightbox||e.target===lightboxStage)closeLightbox()});
document.addEventListener('keydown',e=>{
  if(!lightbox.classList.contains('open'))return;
  if(e.key==='Escape')closeLightbox();
  else if(e.key==='ArrowLeft')moveLightbox(-1);
  else if(e.key==='ArrowRight')moveLightbox(1);
});
lightboxStage.addEventListener('touchstart',e=>{touchStartX=e.changedTouches[0].clientX},{passive:true});
lightboxStage.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchStartX;
  if(Math.abs(dx)>45)moveLightbox(dx>0?-1:1);
},{passive:true});

const grid=document.getElementById('caseGrid');if(active.blocks){if(activeKey==='digital'||activeKey==='tech'||activeKey==='packaging')grid.classList.add('digital-grid');active.blocks.forEach(block=>{const el=document.createElement('article');el.className='case-block reveal'+(block.wide?' wide':'');el.innerHTML='<small>'+block.label+'</small><h2>'+block.title+'</h2>'+block.body+(block.showTools?'<div class="case-tools">'+active.tools.map(t=>'<span>'+t+'</span>').join('')+'</div>':'');grid.appendChild(el)})}else{const blocks=[['PROBLEM','Problem',active.problemHtml||('<p>'+active.problem+'</p>')],['WHAT I DID','What I did',active.didHtml||('<p>'+active.did+'</p>')],['RESULT','Result',active.resultHtml||('<p>'+active.result+'</p>')]];blocks.forEach(([label,title,body],i)=>{const el=document.createElement('article');el.className='case-block reveal';el.innerHTML='<small>'+label+'</small><h2>'+title+'</h2>'+body+(i===1?'<div class="case-tools">'+active.tools.map(t=>'<span>'+t+'</span>').join('')+'</div>':'');grid.appendChild(el)})}
requestAnimationFrame(()=>document.body.classList.add('page-ready'));
const ro=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('show')}),{threshold:.08});document.querySelectorAll('.reveal').forEach(el=>ro.observe(el));
const cursor=document.querySelector('.cursor-dot');if(cursor){window.addEventListener('pointermove',e=>{cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px'});document.querySelectorAll('a,button,.case-visual').forEach(el=>{el.addEventListener('pointerenter',()=>document.body.classList.add('link-hover'));el.addEventListener('pointerleave',()=>document.body.classList.remove('link-hover'))})}
