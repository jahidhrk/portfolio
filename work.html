<script>
const cases={
intelligence:{title:'Marketing Intelligence & Data Analysis',intro:'Research, consumer surveys, dashboards and market analysis that turn raw information into clear, decision-ready business direction.',metric:'181 valid survey responses',metricNoteHtml:'<p class="case-metric-lead">The research identified clear consumer needs and product opportunities across Fresh Chicken, Ready-to-Cook and Ready-to-Eat categories.</p><ul class="case-metric-list"><li><strong>87.3%</strong>preferred products that reduce preparation time</li><li><strong>84.0%</strong>purchased and consumed chicken at least weekly</li><li><strong>71.8%</strong>considered quality an important purchase factor</li><li><strong>61.3%</strong>preferred curry-cut Fresh Chicken formats</li><li><strong>74.0%</strong>showed interest in Ready-to-Cook Chicken Curry</li><li><strong>69.1%</strong>showed high interest in Ready-to-Eat chicken meals</li></ul>',visuals:['assets/projects/intelligence-01.png','assets/projects/intelligence-02.png','assets/projects/intelligence-03.png'],problemHtml:'<p>Management needed reliable consumer evidence to understand chicken-buying behavior, preparation difficulties and product preferences across <strong>Fresh Chicken, Ready-to-Cook and Ready-to-Eat</strong> categories.</p>',didHtml:'<p>I analyzed <strong>181 valid consumer survey responses</strong>, cleaned and structured the data, identified the strongest behavioral and product-preference trends, and converted the findings into management-ready dashboards and practical product recommendations.</p>',resultHtml:'<p>The analysis provided clear direction for product, packaging and marketing decisions:</p><ul class="case-result-list"><li>Prioritize convenient <strong>500g Fresh Chicken and Ready-to-Cook packs</strong></li><li>Focus on curry-cut formats, especially <strong>curry cut without skin</strong></li><li>Prioritize RTC flavors such as <strong>Chicken Curry, Chicken Bhuna and Jhal Fry</strong></li><li>Explore <strong>250g Ready-to-Eat meal packs</strong></li><li>Emphasize <strong>quality, freshness, hygiene and convenience</strong> in communication</li><li>Use <strong>sampling, introductory offers and recipe demonstrations</strong> to encourage trial</li></ul><p style="margin-top:14px">The survey transformed disconnected consumer responses into practical product-development and marketing direction.</p>',tools:['Consumer Survey Analysis','Excel','Dashboard Design','Market Analysis','Product Insight','Management Reporting']},
digital:{title:'Digital Marketing & Campaigns',intro:'Campaign strategy, social media planning, paid boosting and performance analysis connected to measurable business outcomes.',metric:'2.63M reach',metricNote:'August 2026 paid-media period: 22,010 link clicks on $351.38 spend; 5,792 Facebook visits, 3,693 Instagram visits and 486 calls.',visuals:['assets/projects/digital-01.png','assets/projects/digital-02.png','assets/projects/digital-03.png'],problem:'The brand needed stronger visibility, clearer monthly content planning and measurable paid-media performance instead of isolated posts and ad activity.',did:'Planned content mix and boosting priorities, tracked reach/clicks/visits/calls, reviewed performance by content and translated results into management dashboards and next-step recommendations.',result:'The August 2026 campaign period reached 2.63M people and generated 22,010 link clicks, with measurable traffic and call activity supporting brand visibility and lead generation.',tools:['Meta campaigns','Content planning','Boosting strategy','Performance analysis','Executive dashboards']},
design:{title:'Graphic Design & Brand Communication',intro:'Campaign systems, social-first creative, corporate communication and brand assets across consumer and business touchpoints.',metric:'[ADD METRIC]',metricNote:'Add the verified number of campaigns, creatives or brands supported.',visuals:['assets/projects/design-01.png','assets/projects/design-02.png','assets/projects/design-03.png'],problem:'Different brand and communication needs had to stay visually consistent while working across offers, social content, corporate communication, events and product-led campaigns.',did:'Created campaign visual systems, social media content, corporate/business communication and multi-format adaptations across CP Five Star, CP Brand and related food-business work.',result:'Built a more coherent visual language across customer-facing and business-facing materials. Add a verified production or campaign metric to quantify scale.',tools:['Adobe Photoshop','Adobe Illustrator','Campaign design','Brand communication','Social creative']},
packaging:{title:'Packaging Design & NPD',intro:'Consumer-led packaging, mockups, dielines and brand consistency systems designed to make products clearer, more trustworthy and easier to recognize.',metric:'[ADD METRIC]',metricNote:'Add the verified number of SKUs / packs developed or redesigned.',visuals:[null,null,null],problem:'New and existing products needed clearer packaging hierarchy, consistent brand identity and stronger front-of-pack communication for modern retail consumers.',did:'Worked on packaging concepts, food/product visualization, mockups, front-of-pack hierarchy, brand consistency and NPD communication while using consumer feedback to guide design choices.',result:'Created a repeatable packaging direction focused on recognition, clarity and product appetite. Add the verified SKU count and launch/result metric.',tools:['Packaging design','NPD','Mockups','Dielines','Consumer feedback']},
activation:{title:'Brand Activation & Event Management',intro:'Exhibitions, launches, activations and event communication that connect physical execution with brand visibility and customer engagement.',metric:'[ADD METRIC]',metricNote:'Add the verified number of events, activations, visitors or leads.',visuals:[null,null,null],problem:'Brand events and exhibitions needed coordinated communication, strong on-ground visibility and practical execution across multiple physical touchpoints.',did:'Supported event strategy, booth/activation communication, opening materials, POSM, exhibition planning and customer-facing execution across brand and product initiatives.',result:'Created clearer, more integrated event experiences. Add verified counts for events, visitors, leads or franchise conversions to quantify impact.',tools:['Event planning','Brand activation','POSM','Exhibition strategy','Launch communication']},
tech:{title:'AI, Digital Systems & Technology',intro:'Hands-on business systems, offline AI, computer vision and robotics projects that connect software experimentation with practical use cases.',metric:'3+ prototypes',metricNote:'Public hands-on examples include an offline AI assistant, computer-vision safety detection and autonomous humanoid robotics.',visuals:['assets/projects/tech-01.png','assets/projects/tech-02.png','assets/projects/tech-03.png'],problem:'Business and technical workflows often need simpler interfaces, automation or intelligent monitoring rather than more manual steps.',did:'Worked on a Digital Order System; built an offline Windows AI voice assistant with commands, TTS and app control; developed mask/social-distancing detection using YOLOv3, SSD, MobileNetV2, OpenCV and TensorFlow/Keras; explored 17-DOF Arduino/Python/OpenCV humanoid robotics.',result:'Built multiple working prototypes across digital workflow, AI, computer vision and robotics. Add verified user/time-saved metrics for the business systems when available.',tools:['OpenCV','TensorFlow / Keras','YOLOv3','SSD','MobileNetV2','Flask','Arduino','Python','TTS']},

const order=['intelligence','digital','design','packaging','activation','tech','apparel','presentation'];
const q=new URLSearchParams(location.search).get('category');const active=cases[q]||cases.intelligence;const activeKey=cases[q]?q:'intelligence';

document.getElementById('title').textContent=active.title+'.';document.getElementById('intro').textContent=active.intro;document.getElementById('metric').textContent=active.metric;const metricNote=document.getElementById('metricNote');if(active.metricNoteHtml){metricNote.innerHTML=active.metricNoteHtml}else{metricNote.textContent=active.metricNote||''}document.title=active.title+' | Jahid Hassan Rakib Portfolio';
const visuals=document.getElementById('visuals');active.visuals.forEach((src,i)=>{const d=document.createElement('div');d.className='case-visual';if(src){const img=document.createElement('img');img.src=src;img.alt=active.title+' visual '+(i+1);img.onerror=()=>{d.innerHTML='<div class="case-empty">Visual '+String(i+1).padStart(2,'0')+' · add verified project image</div>'};d.appendChild(img)}else d.innerHTML='<div class="case-empty">Visual '+String(i+1).padStart(2,'0')+' · add verified project image</div>';visuals.appendChild(d)});
const blocks=[['PROBLEM','Problem',active.problemHtml||('<p>'+active.problem+'</p>')],['WHAT I DID','What I did',active.didHtml||('<p>'+active.did+'</p>')],['RESULT','Result',active.resultHtml||('<p>'+active.result+'</p>')]];const grid=document.getElementById('caseGrid');blocks.forEach(([label,title,body],i)=>{const el=document.createElement('article');el.className='case-block reveal';el.innerHTML='<small>'+label+'</small><h2>'+title+'</h2>'+body+(i===1?'<div class="case-tools">'+active.tools.map(t=>'<span>'+t+'</span>').join('')+'</div>':'');grid.appendChild(el)});
requestAnimationFrame(()=>document.body.classList.add('page-ready'));
const ro=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('show')}),{threshold:.08});document.querySelectorAll('.reveal').forEach(el=>ro.observe(el));
const cursor=document.querySelector('.cursor-dot');if(cursor){window.addEventListener('pointermove',e=>{cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px'});document.querySelectorAll('a,button,.case-visual').forEach(el=>{el.addEventListener('pointerenter',()=>document.body.classList.add('link-hover'));el.addEventListener('pointerleave',()=>document.body.classList.remove('link-hover'))})}
</script>
